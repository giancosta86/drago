name: Deploy

on:
  pull_request:
    types: closed
    branches: main

jobs:
  publish-to-npm:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: giancosta86/aurora-github/actions/publish-rust-wasm@v12
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}
          npm-scope: giancosta86
          wasm-pack-version: 0.15.0
          node-version: 26.2.0
          package-manager: pnpm@10.22.0

  tag-and-release:
    runs-on: ubuntu-24.04
    needs: publish-to-npm
    steps:
      - uses: actions/checkout@v7

      - uses: giancosta86/aurora-github/actions/tag-and-release@v12
